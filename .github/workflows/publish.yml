        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ runner.temp }}\out\opencode-desktop-win-arm64.exe
            ${{ runner.temp }}\out\opencode-desktop-win-x64.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signatures
        if: needs.plan.outputs.dry_run != 'true'
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\out" -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne "Valid") { throw "Invalid signature for $($_.FullName): $($sig.Status)" }
          }

      - id: stage
        working-directory: ${{ runner.temp }}/out
        run: |
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: environment release. No repository checkout, no repository code.
  # Destinations, names and channels come from plan and this file, never from artifacts.
  # ---------------------------------------------------------------------------

  publish-npm:
    needs: [plan, build-npm, sign-cli-macos, sign-cli-windows, attest]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.npm == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm
          path: ${{ runner.temp }}/npm

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-macos-signed
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-windows-signed
          path: ${{ runner.temp }}/windows

      - name: Verify artifacts
        env:
          MACOS_DIGEST: ${{ needs.sign-cli-macos.outputs.digest }}
          WINDOWS_DIGEST: ${{ needs.sign-cli-windows.outputs.digest }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verify() {
            (cd "$1"
              if [ -n "${2:-}" ] && [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$2" ]; then echo "SHA256SUMS digest mismatch in $1"; exit 1; fi
              sha256sum -c --strict --quiet SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
          }
          verify "$RUNNER_TEMP/npm"
          verify "$RUNNER_TEMP/macos" "$MACOS_DIGEST"
          verify "$RUNNER_TEMP/windows" "$WINDOWS_DIGEST"
          if [ "$DRY_RUN" != true ]; then
            for f in "$RUNNER_TEMP"/npm/*.tgz; do
              gh attestation verify "$f" --repo anomalyco/opencode --signer-workflow anomalyco/opencode/.github/workflows/publish.yml > /dev/null
            done
          fi

      - name: Check packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NODE_CLI: ${{ needs.plan.outputs.node_cli }}
        run: |
          targets="linux-arm64 linux-x64 linux-x64-baseline linux-arm64-musl linux-x64-musl linux-x64-baseline-musl darwin-arm64 darwin-x64 darwin-x64-baseline windows-arm64 windows-x64 windows-x64-baseline"
          expected="@opencode/cli"
          for t in $targets; do expected="$expected @opencode/cli-$t"; done
          for lib in schema codemode theme ai util protocol client plugin plugin-browser core simulation server sdk ui; do expected="$expected @opencode/$lib"; done
          if [ "$NODE_CLI" = true ]; then
            expected="$expected @opencode/cli-node"
            for t in linux-arm64 linux-x64 darwin-arm64 windows-arm64 windows-x64; do expected="$expected @opencode/cli-node-$t"; done
          fi

          : > "$RUNNER_TEMP/publish.tsv"
          for f in "$RUNNER_TEMP"/macos/*.tgz "$RUNNER_TEMP"/windows/*.tgz "$RUNNER_TEMP"/npm/*.tgz; do
            meta=$(tar -xzOf "$f" package/package.json | jq -r '[.name, .version, ((.publishConfig // {}) | keys - ["access"] | length > 0), ((.scripts // {}) | (has("preinstall") or has("install") or has("postinstall")))] | @tsv')
            IFS=$'\t' read -r name version config install <<< "$meta"
            if ! printf '%s\n' $expected | grep -qxF -- "$name"; then echo "Unexpected package $name in $f"; exit 1; fi
            if [ "$version" != "$VERSION" ]; then echo "$name has version $version, expected $VERSION"; exit 1; fi
            if [ "$config" != false ]; then echo "$name sets publishConfig beyond access"; exit 1; fi
            if [ "$install" != false ] && [ "$name" != @opencode/cli ] && [ "$name" != @opencode/cli-node ]; then echo "$name has an install script"; exit 1; fi
            if cut -f1 "$RUNNER_TEMP/publish.tsv" | grep -qxF -- "$name"; then echo "$name is packed twice"; exit 1; fi
            printf '%s\t%s\n' "$name" "$f" >> "$RUNNER_TEMP/publish.tsv"
          done
          for name in $expected; do
            if ! cut -f1 "$RUNNER_TEMP/publish.tsv" | grep -qxF -- "$name"; then echo "Missing package $name"; exit 1; fi
          done
          # The CLI wrappers resolve their platform packages, so they publish last.
          { grep -vP '^@opencode/cli(-node)?\t' "$RUNNER_TEMP/publish.tsv" || true; grep -P '^@opencode/cli(-node)?\t' "$RUNNER_TEMP/publish.tsv"; } > "$RUNNER_TEMP/order.tsv"
          cat "$RUNNER_TEMP/order.tsv"

      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.npm_tag }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          # A clean directory and config, so nothing from an artifact can redirect the registry.
          work=$(mktemp -d)
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          cd "$work"
          npm --version
          flags=(--tag "$TAG" --access public --ignore-scripts)
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); else flags+=(--provenance); fi
          while IFS=$'\t' read -r name file; do
            if [ "$DRY_RUN" != true ] && npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "already published $name@$VERSION"
              continue
            fi
            npm publish "$file" "${flags[@]}"
          done < "$RUNNER_TEMP/order.tsv"

  # Uploads the standalone CLI archives to opencode.ai/files and registers them with the update server.
  publish-cli:
    needs: [plan, build-npm, sign-cli-macos, sign-cli-windows, publish-npm]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.npm == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-archives
          path: ${{ runner.temp }}/archives

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-macos-signed
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-windows-signed
          path: ${{ runner.temp }}/windows

      - name: Verify artifacts
        env:
          MACOS_DIGEST: ${{ needs.sign-cli-macos.outputs.digest }}
          WINDOWS_DIGEST: ${{ needs.sign-cli-windows.outputs.digest }}
        run: |
          verify() {
            (cd "$1"
              if [ -n "${2:-}" ] && [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$2" ]; then echo "SHA256SUMS digest mismatch in $1"; exit 1; fi
              sha256sum -c --strict --quiet SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
          }
          verify "$RUNNER_TEMP/archives"
          verify "$RUNNER_TEMP/macos" "$MACOS_DIGEST"
          verify "$RUNNER_TEMP/windows" "$WINDOWS_DIGEST"

      - name: Upload and register
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          NODE_CLI: ${{ needs.plan.outputs.node_cli }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          CLOUDFLARE_ACCOUNT_ID: 15d29c8639fd3733b1b5486a2acfd968
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cli=""
          for t in linux-arm64 linux-x64 linux-x64-baseline linux-arm64-musl linux-x64-musl linux-x64-baseline-musl; do cli="$cli $RUNNER_TEMP/archives/opencode-$t.tar.gz"; done
          for t in darwin-arm64 darwin-x64 darwin-x64-baseline; do cli="$cli $RUNNER_TEMP/macos/opencode-$t.zip"; done
          for t in windows-arm64 windows-x64 windows-x64-baseline; do cli="$cli $RUNNER_TEMP/windows/opencode-$t.zip"; done
          node=""
          if [ "$NODE_CLI" = true ]; then
            for t in linux-arm64 linux-x64; do node="$node $RUNNER_TEMP/archives/opencode2-node-$t.tar.gz"; done
            for t in darwin-arm64 windows-arm64 windows-x64; do node="$node $RUNNER_TEMP/archives/opencode2-node-$t.zip"; done
          fi

          # R2 accepts the API token ID as the access key and SHA-256(token) as the secret.
          if [ "$DRY_RUN" != true ]; then
            token_id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -er .result.id)
            export AWS_ACCESS_KEY_ID="$token_id"
            AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
            export AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          fi
          files_json() {
            for f in "$@"; do
              test -s "$f"
              name=$(basename "$f")
              type=application/zip
              case "$name" in *.tar.gz) type=application/gzip ;; esac
              if [ "$DRY_RUN" = true ]; then
                echo "dry-run upload: bin/$VERSION/$name" >&2
              else
                aws s3 cp "$f" "s3://opencode-production-files/bin/$VERSION/$name" --only-show-errors \
                  --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
                  --content-type "$type" --content-disposition "attachment; filename=\"$name\"" \
                  --cache-control "public, max-age=31536000, immutable" >&2
              fi
              jq -n --arg name "$name" --arg url "https://opencode.ai/files/bin/$VERSION/$name" \
                --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" \
                '{($name): {url: $url, sha256: $sha256, size: $size}}'
            done | jq -s 'add'
          }
          publish() {
            echo "$1" | jq .
            if [ "$DRY_RUN" = true ]; then return; fi
            oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://update.opencode.ai" | jq -er .value)
            for attempt in 1 2 3; do
              status=$(curl -sS -o "$RUNNER_TEMP/response" -w '%{http_code}' -X POST https://opencode.ai/update/api/publish \
                -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data "$1")
              if [ "$status" -lt 300 ]; then return; fi
              cat "$RUNNER_TEMP/response"
              # D1 can commit the upsert and still time out. Replaying the same artifact is safe.
              if [ "$status" -lt 500 ] || [ "$attempt" = 3 ]; then echo "Update server returned $status"; exit 1; fi
              sleep "$attempt"
            done
          }

          # shellcheck disable=SC2086
          files=$(files_json $cli)
          publish "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" '{channel: $c, name: "cli", distribution: "npm", version: $v, metadata: {package: "@opencode/cli"}}')"
          publish "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" --argjson files "$files" '{channel: $c, name: "cli", distribution: "opencode", version: $v, metadata: {files: $files}}')"
          if [ -n "$node" ]; then
            # shellcheck disable=SC2086
            files=$(files_json $node)
            publish "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" '{channel: $c, name: "cli-node", distribution: "npm", version: $v, metadata: {package: "@opencode/cli-node"}}')"
            publish "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" --argjson files "$files" '{channel: $c, name: "cli-node", distribution: "opencode", version: $v, metadata: {files: $files}}')"
          fi

  # Uploads the signed desktop builds and registers the update feeds. The electron-updater metadata
  # is computed here from the final signed files, never taken from the build.
  publish-desktop:
    needs: [plan, build-desktop, sign-desktop-macos, sign-desktop-windows-installer]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-macos
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-unsigned-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/linux-x64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-unsigned-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/linux-arm64

      - name: Verify artifacts
        env:
          MACOS_DIGEST: ${{ needs.sign-desktop-macos.outputs.digest }}
          WINDOWS_DIGEST: ${{ needs.sign-desktop-windows-installer.outputs.digest }}
        run: |
          verify() {
            (cd "$1"
              if [ -n "${2:-}" ] && [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$2" ]; then echo "SHA256SUMS digest mismatch in $1"; exit 1; fi
              sha256sum -c --strict --quiet SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
          }
          verify "$RUNNER_TEMP/macos" "$MACOS_DIGEST"
          verify "$RUNNER_TEMP/windows" "$WINDOWS_DIGEST"
          verify "$RUNNER_TEMP/linux-x64"
          verify "$RUNNER_TEMP/linux-arm64"

      - name: Upload and register
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          CLOUDFLARE_ACCOUNT_ID: 15d29c8639fd3733b1b5486a2acfd968
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          d="$RUNNER_TEMP"
          win="$d/windows/opencode-desktop-win-arm64.exe $d/windows/opencode-desktop-win-x64.exe"
          mac="$d/macos/opencode-desktop-mac-arm64.zip $d/macos/opencode-desktop-mac-arm64.dmg $d/macos/opencode-desktop-mac-x64.zip $d/macos/opencode-desktop-mac-x64.dmg"
          linux="$d/linux-x64/opencode-desktop-linux-x86_64.AppImage $d/linux-x64/opencode-desktop-linux-amd64.deb $d/linux-x64/opencode-desktop-linux-x86_64.rpm"
          linux_arm64="$d/linux-arm64/opencode-desktop-linux-arm64.AppImage $d/linux-arm64/opencode-desktop-linux-arm64.deb $d/linux-arm64/opencode-desktop-linux-aarch64.rpm"
          bundles="$d/macos/opencode-desktop-mac-arm64.app.tar.gz $d/macos/opencode-desktop-mac-x64.app.tar.gz"

          if [ "$DRY_RUN" != true ]; then
            token_id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -er .result.id)
            export AWS_ACCESS_KEY_ID="$token_id"
            AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
            export AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          fi
          url() { echo "https://opencode.ai/files/bin/$VERSION/$(basename "$1")"; }
          files="{}"
          # shellcheck disable=SC2086
          for f in $win $mac $linux $linux_arm64 $bundles; do
            test -s "$f"
            name=$(basename "$f")
            if [ "$DRY_RUN" = true ]; then
              echo "dry-run upload: bin/$VERSION/$name"
            else
              aws s3 cp "$f" "s3://opencode-production-files/bin/$VERSION/$name" --only-show-errors \
                --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
                --content-type application/octet-stream --content-disposition "attachment; filename=\"$name\"" \
                --cache-control "public, max-age=31536000, immutable"
            fi
            files=$(jq --arg name "$name" --arg url "$(url "$f")" --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$f")" '. + {($name): {url: $url, sha256: $sha256, size: $size}}' <<< "$files")
          done
          manifest() {
            for f in "$@"; do
              jq -n --arg url "$(url "$f")" --arg sha512 "$(openssl dgst -sha512 -binary "$f" | base64 -w0)" \
                --argjson size "$(stat -c %s "$f")" '{url: $url, sha512: $sha512, size: $size}'
            done | jq -s --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" '{files: ., releaseDate: $date}'
          }
          # shellcheck disable=SC2086
          manifests=$(jq -n \
            --argjson win "$(manifest $win)" \
            --argjson mac "$(manifest $mac)" \
            --argjson linux "$(manifest $linux)" \
            --argjson linux_arm64 "$(manifest $linux_arm64)" \
            '{"desktop.yml": $win, "desktop-mac.yml": $mac, "desktop-linux.yml": $linux, "desktop-linux-arm64.yml": $linux_arm64}')
          artifact=$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" --argjson files "$files" --argjson manifests "$manifests" \
            '{channel: $c, name: "desktop", distribution: "opencode", version: $v, metadata: {files: $files, manifests: $manifests}}')
          echo "$artifact" | jq .
          if [ "$DRY_RUN" = true ]; then exit 0; fi

          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://update.opencode.ai" | jq -er .value)
          for attempt in 1 2 3; do
            status=$(curl -sS -o "$RUNNER_TEMP/response" -w '%{http_code}' -X POST https://opencode.ai/update/api/publish \
              -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data "$artifact")
            if [ "$status" -lt 300 ]; then exit 0; fi
            cat "$RUNNER_TEMP/response"
            if [ "$status" -lt 500 ] || [ "$attempt" = 3 ]; then echo "Update server returned $status"; exit 1; fi
            sleep "$attempt"
          done

  publish-docker:
    needs: [plan, build-docker]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
          path: ${{ runner.temp }}/image

      - name: Push
        working-directory: ${{ runner.temp }}/image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c --strict SHA256SUMS
          skopeo inspect --raw oci-archive:opencode-image.tar | jq .
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          skopeo copy --all oci-archive:opencode-image.tar "docker://ghcr.io/anomalyco/opencode:$VERSION"

  publish-homebrew:
    needs: [plan, build-npm, sign-cli-macos, publish-cli]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-archives
          path: ${{ runner.temp }}/archives

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-macos-signed
          path: ${{ runner.temp }}/macos

      - name: Verify artifacts
        env:
          MACOS_DIGEST: ${{ needs.sign-cli-macos.outputs.digest }}
        run: |
          verify() {
            (cd "$1"
              if [ -n "${2:-}" ] && [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$2" ]; then echo "SHA256SUMS digest mismatch in $1"; exit 1; fi
              sha256sum -c --strict --quiet SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
          }
          verify "$RUNNER_TEMP/archives"
          verify "$RUNNER_TEMP/macos" "$MACOS_DIGEST"

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        if: needs.plan.outputs.dry_run != 'true'
        id: token
        with:
          app-id: ${{ vars.OPENCODE_APP_ID }}
          private-key: ${{ secrets.OPENCODE_APP_SECRET }}
          owner: anomalyco
          repositories: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          base="https://opencode.ai/files/bin/$VERSION"
          tap="$RUNNER_TEMP/tap"
          if [ "$DRY_RUN" = true ]; then
            mkdir -p "$tap"
          else
            git clone -q "https://x-access-token:$TOKEN@github.com/anomalyco/homebrew-tap.git" "$tap"
          fi
          cat > "$tap/opencode-v2.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          class OpencodeV2 < Formula
            desc "OpenCode V2 - the AI coding agent for the terminal"
            homepage "https://github.com/anomalyco/opencode"
            version "$VERSION"
            license "MIT"

            depends_on "ripgrep"
            conflicts_with "opencode", because: "both install an opencode binary"

            on_macos do
              if Hardware::CPU.arm?
                url "$base/opencode-darwin-arm64.zip"
                sha256 "$(sum "$RUNNER_TEMP/macos/opencode-darwin-arm64.zip")"
              else
                url "$base/opencode-darwin-x64-baseline.zip"
                sha256 "$(sum "$RUNNER_TEMP/macos/opencode-darwin-x64-baseline.zip")"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$base/opencode-linux-arm64.tar.gz"
                sha256 "$(sum "$RUNNER_TEMP/archives/opencode-linux-arm64.tar.gz")"
              else
                url "$base/opencode-linux-x64-baseline.tar.gz"
                sha256 "$(sum "$RUNNER_TEMP/archives/opencode-linux-x64-baseline.tar.gz")"
              end
            end

            def install
              bin.install "opencode"
            end
          end
          EOF
          cat "$tap/opencode-v2.rb"
          if [ "$DRY_RUN" = true ]; then exit 0; fi

          cd "$tap"
          git add opencode-v2.rb
          if ! git diff --cached --quiet; then
            git -c user.name="opencode-agent[bot]" -c user.email="opencode-agent[bot]@users.noreply.github.com" \
              commit -q -m "chore: update opencode-v2 to $VERSION"
            git push -q origin HEAD:master
          fi
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://update.opencode.ai" | jq -er .value)
          curl -fsS -X POST https://opencode.ai/update/api/publish -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
            --data "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" '{channel: $c, name: "cli", distribution: "homebrew", version: $v, metadata: {package: "anomalyco/tap/opencode-v2"}}')"

  # The AUR package installs the published npm tarballs, so it follows the npm publish.
  publish-aur:
    needs: [plan, build-npm, publish-npm]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm
          path: ${{ runner.temp }}/npm

      - name: Verify artifact
        working-directory: ${{ runner.temp }}/npm
        run: |
          sha256sum -c --strict --quiet SHA256SUMS
          diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)

      - name: Update package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          name=opencode-beta
          pkgver="${VERSION//-/.}"
          repo="$RUNNER_TEMP/aur"
          if [ "$DRY_RUN" = true ]; then
            mkdir -p "$repo"
            printf 'MIT License\n' > "$repo/LICENSE"
          else
            mkdir -p ~/.ssh
            printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
            chmod 600 ~/.ssh/aur
            echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > ~/.ssh/known_hosts
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git clone -q "ssh://aur@aur.archlinux.org/$name.git" "$repo"
          fi
          cd "$repo"
          test -s LICENSE
          printf '#!/bin/sh\nexec "$(dirname "$0")/opencode" "$@"\n' > opencode2
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          x64="$RUNNER_TEMP/npm/opencode-cli-linux-x64-baseline-$VERSION.tgz"
          arm64="$RUNNER_TEMP/npm/opencode-cli-linux-arm64-$VERSION.tgz"
          x64_url="https://registry.npmjs.org/@opencode/cli-linux-x64-baseline/-/cli-linux-x64-baseline-$VERSION.tgz"
          arm64_url="https://registry.npmjs.org/@opencode/cli-linux-arm64/-/cli-linux-arm64-$VERSION.tgz"

          # Stripping a compiled Bun executable can damage its embedded application.
          cat > PKGBUILD <<EOF
          # Maintainer: Dax <mail@thdxr.com>
          pkgname=$name
          pkgver=$pkgver
          pkgrel=1
          pkgdesc='OpenCode beta - the AI coding agent for the terminal'
          url='https://github.com/anomalyco/opencode'
          arch=('x86_64' 'aarch64')
          license=('MIT')
          depends=('glibc' 'gcc-libs' 'ripgrep')
          provides=('opencode' 'opencode2')
          conflicts=('opencode' 'opencode2')
          options=('!strip' '!debug')
          source=('LICENSE' 'opencode2')
          sha256sums=('$(sum LICENSE)' '$(sum opencode2)')
          source_x86_64=('$name-$pkgver-x86_64.tgz::$x64_url')
          sha256sums_x86_64=('$(sum "$x64")')
          source_aarch64=('$name-$pkgver-aarch64.tgz::$arm64_url')
          sha256sums_aarch64=('$(sum "$arm64")')

          package() {
            install -Dm755 "\$srcdir/package/bin/opencode" "\$pkgdir/usr/bin/opencode"
            install -Dm755 "\$srcdir/opencode2" "\$pkgdir/usr/bin/opencode2"
            install -Dm644 "\$srcdir/LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
          }
          EOF
          cat > .SRCINFO <<EOF
          pkgbase = $name
          	pkgdesc = OpenCode beta - the AI coding agent for the terminal
          	pkgver = $pkgver
          	pkgrel = 1
          	url = https://github.com/anomalyco/opencode
          	arch = x86_64
          	arch = aarch64
          	license = MIT
          	depends = glibc
          	depends = gcc-libs
          	depends = ripgrep
          	provides = opencode
          	provides = opencode2
          	conflicts = opencode
          	conflicts = opencode2
          	options = !strip
          	options = !debug
          	source = LICENSE
          	source = opencode2
          	sha256sums = $(sum LICENSE)
          	sha256sums = $(sum opencode2)
          	source_x86_64 = $name-$pkgver-x86_64.tgz::$x64_url
          	sha256sums_x86_64 = $(sum "$x64")
          	source_aarch64 = $name-$pkgver-aarch64.tgz::$arm64_url
          	sha256sums_aarch64 = $(sum "$arm64")

          pkgname = $name
          EOF
          cat PKGBUILD .SRCINFO
          if [ "$DRY_RUN" = true ]; then exit 0; fi

          git add PKGBUILD .SRCINFO LICENSE opencode2
          if ! git diff --cached --quiet; then
            git -c user.name=opencode -c user.email=opencode@sst.dev commit -q -m "chore: update $name to $pkgver"
            git push -q origin HEAD:master
          fi
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://update.opencode.ai" | jq -er .value)
          curl -fsS -X POST https://opencode.ai/update/api/publish -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
            --data "$(jq -n --arg c "$CHANNEL" --arg v "$VERSION" --arg p "$name" '{channel: $c, name: "cli", distribution: "aur", version: $v, metadata: {package: $p}}')"

  # WinGet manifests as data. Submission to microsoft/winget-pkgs stays paused until the packages are
  # accepted; the manifests are attached to the run so they can be submitted by hand.
  winget-manifests:
    needs: [plan, sign-cli-windows, sign-desktop-windows-installer]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-windows-signed
          path: ${{ runner.temp }}/cli

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/desktop

      - name: Write manifests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CLI_DIGEST: ${{ needs.sign-cli-windows.outputs.digest }}
          DESKTOP_DIGEST: ${{ needs.sign-desktop-windows-installer.outputs.digest }}
        run: |
          [ "$(sha256sum "$RUNNER_TEMP/cli/SHA256SUMS" | cut -d' ' -f1)" = "$CLI_DIGEST" ]
          [ "$(sha256sum "$RUNNER_TEMP/desktop/SHA256SUMS" | cut -d' ' -f1)" = "$DESKTOP_DIGEST" ]
          (cd "$RUNNER_TEMP/cli" && sha256sum -c --strict --quiet SHA256SUMS)
          (cd "$RUNNER_TEMP/desktop" && sha256sum -c --strict --quiet SHA256SUMS)
          sum() { sha256sum "$1" | cut -d' ' -f1 | tr a-f A-F; }
          base="https://opencode.ai/files/bin/$VERSION"
          date=$(date -u +%F)
          out="$RUNNER_TEMP/winget"
          header() {
            printf '# yaml-language-server: $schema=https://aka.ms/winget-manifest.%s.1.12.0.schema.json\n\nPackageIdentifier: %s\nPackageVersion: %s\n' "$2" "$1" "$VERSION"
          }
          footer() { printf 'ManifestType: %s\nManifestVersion: 1.12.0\n' "$1"; }
          locale() {
            header "$1" defaultLocale
            printf '%s\n' "PackageLocale: en-US" "Publisher: OpenCode" "PublisherUrl: https://anoma.ly/" \
              "PublisherSupportUrl: https://github.com/anomalyco/opencode/issues" "PrivacyUrl: https://opencode.ai/legal/privacy-policy" \
              "PackageName: $2" "PackageUrl: https://opencode.ai/" "License: MIT" "LicenseUrl: https://github.com/anomalyco/opencode/blob/HEAD/LICENSE" \
              "ShortDescription: $3" "Moniker: $4" "Tags:" "- ai" "- coding-agent" "- developer-tools" \
              "Documentations:" "- DocumentLabel: Docs" "  DocumentUrl: https://opencode.ai/v2/docs"
            footer defaultLocale
          }

          id=Anomaly.OpenCode
          mkdir -p "$out/$id"
          { header $id version; echo "DefaultLocale: en-US"; footer version; } > "$out/$id/$id.yaml"
          {
            header $id installer
            printf '%s\n' "InstallerType: zip" "NestedInstallerType: portable" "NestedInstallerFiles:" \
              "- RelativeFilePath: opencode.exe" "  PortableCommandAlias: opencode" "Commands:" "- opencode" "ReleaseDate: $date" "Installers:" \
              "- Architecture: x64" "  InstallerUrl: $base/opencode-windows-x64-baseline.zip" "  InstallerSha256: $(sum "$RUNNER_TEMP/cli/opencode-windows-x64-baseline.zip")" \
              "- Architecture: arm64" "  InstallerUrl: $base/opencode-windows-arm64.zip" "  InstallerSha256: $(sum "$RUNNER_TEMP/cli/opencode-windows-arm64.zip")"
            footer installer
          } > "$out/$id/$id.installer.yaml"
          locale $id "OpenCode CLI" "The open source AI coding agent for the terminal." opencode > "$out/$id/$id.locale.en-US.yaml"

          # The display name and uninstall key match what the NSIS installer registers for ai.opencode.desktop.
          id=Anomaly.OpenCode.Desktop
          mkdir -p "$out/$id"
          { header $id version; echo "DefaultLocale: en-US"; footer version; } > "$out/$id/$id.yaml"
          {
            header $id installer
            printf '%s\n' "InstallerType: nullsoft" "Scope: user" "UpgradeBehavior: install" "ProductCode: d074f30d-5f88-5885-b075-be1348cc7676" \
              "Protocols:" "- opencode" "ReleaseDate: $date" "Installers:" \
              "- Architecture: x64" "  InstallerUrl: $base/opencode-desktop-win-x64.exe" "  InstallerSha256: $(sum "$RUNNER_TEMP/desktop/opencode-desktop-win-x64.exe")" \
              "- Architecture: arm64" "  InstallerUrl: $base/opencode-desktop-win-arm64.exe" "  InstallerSha256: $(sum "$RUNNER_TEMP/desktop/opencode-desktop-win-arm64.exe")"
            footer installer
          } > "$out/$id/$id.installer.yaml"
          locale $id "OpenCode" "The open source AI coding agent as a desktop app." opencode-desktop > "$out/$id/$id.locale.en-US.yaml"
          tail -n +1 "$out"/*/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget
          if-no-files-found: error

  publish-github-release:
    needs:
      [
        plan,
        build-npm,
        sign-cli-macos,
        sign-cli-windows,
        sign-desktop-macos,
        sign-desktop-windows-installer,
        publish-cli,
        publish-desktop,
      ]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{cli-archives,cli-macos-signed,cli-windows-signed,desktop-macos,desktop-windows,desktop-unsigned-*-linux-gnu}"
          path: ${{ runner.temp }}/in

      - name: Verify artifacts
        env:
          CLI_MACOS: ${{ needs.sign-cli-macos.outputs.digest }}
          CLI_WINDOWS: ${{ needs.sign-cli-windows.outputs.digest }}
          DESKTOP_MACOS: ${{ needs.sign-desktop-macos.outputs.digest }}
          DESKTOP_WINDOWS: ${{ needs.sign-desktop-windows-installer.outputs.digest }}
        run: |
          check() { [ "$(sha256sum "$RUNNER_TEMP/in/$1/SHA256SUMS" | cut -d' ' -f1)" = "$2" ] || { echo "SHA256SUMS digest mismatch in $1"; exit 1; }; }
          check cli-macos-signed "$CLI_MACOS"
          check cli-windows-signed "$CLI_WINDOWS"
          check desktop-macos "$DESKTOP_MACOS"
          check desktop-windows "$DESKTOP_WINDOWS"
          mkdir -p "$RUNNER_TEMP/assets"
          for dir in "$RUNNER_TEMP"/in/*; do
            (cd "$dir"
              sha256sum -c --strict --quiet SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
            find "$dir" -maxdepth 1 -type f \( -name 'opencode-*.zip' -o -name 'opencode-*.tar.gz' -o -name 'opencode-desktop-*' \) ! -name '*.tgz' -exec cp {} "$RUNNER_TEMP/assets/" \;
          done
          cd "$RUNNER_TEMP/assets"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Immutable releases lock assets once published, so upload to a draft first.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          tag="v$VERSION"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          if [ "$DRY_RUN" = true ]; then
            ls -la "$RUNNER_TEMP/assets"
            exit 0
          fi
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP"/assets/* --clobber
          gh release edit "$tag" --draft=false

  # Brings the release commit back to dev. Pushing to dev is blocked by rulesets, so it opens a PR.
  release-pr:
    needs: [plan, source, publish-npm, publish-cli, publish-desktop, publish-github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.channel == 'latest' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          branch="release-v$VERSION"
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$SHA" > /dev/null || gh api "repos/$GH_REPO/git/refs/heads/$branch" > /dev/null
          body="Brings the versions and changelog of the published \`v$VERSION\` release back to \`dev\`. The \`v$VERSION\` tag points at this commit."
          if ! gh pr create --base dev --head "$branch" --title "release: v$VERSION" --body "$body"; then
            echo "::warning::Could not open the release PR. Open it by hand: gh pr create --base dev --head $branch"
          fi
