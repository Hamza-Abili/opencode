name: publish
run-name: "${{ format('release {0}{1}', inputs.bump, inputs.version) }}"

# Building is separated from signing and publishing.
#
# - plan decides the version, channel and npm dist-tag from the event, inputs and ref only.
# - source creates the versioned release commit and its v* tag. It runs git, never repository code.
# - build-* jobs run repository code. They have no environment, no secrets and no id-token, and
#   produce artifacts that carry a SHA256SUMS manifest.
# - sign-* and publish-* jobs run in the release environment. They never check out or execute
#   repository code: they download artifacts, verify them, treat them as data, and run the short
#   inline steps below with pinned actions and runner tools.
# - latest can only be published by a workflow_dispatch with a bump or version on dev.

on:
  push:
    branches:
      - dev
      - beta
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string
      release_notes:
        description: "Reviewed V2 release notes for CHANGELOG.md and the GitHub release (optional)"
        required: false
        type: string
  # TEMPORARY: proves the build half and dry-runs the sign and publish steps without secrets.
  pull_request:
    paths:
      - .github/workflows/publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.bump || inputs.version) && 'release' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    if: github.repository == 'anomalyco/opencode'
    permissions: {}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      desktop_channel: ${{ steps.plan.outputs.desktop_channel }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      release: ${{ steps.plan.outputs.release }}
      sign_cli: ${{ steps.plan.outputs.sign_cli }}
      desktop: ${{ steps.plan.outputs.desktop }}
      npm: ${{ steps.plan.outputs.npm }}
      node_cli: ${{ steps.plan.outputs.node_cli }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          versioned=false
          if [ -n "$BUMP" ] || [ -n "$VERSION" ]; then versioned=true; fi
          case "$EVENT:$REF:$versioned" in
            push:refs/heads/dev:false | workflow_dispatch:refs/heads/dev:false) channel=dev ;;
            workflow_dispatch:refs/heads/dev:true) channel=latest ;;
            push:refs/heads/beta:false | workflow_dispatch:refs/heads/beta:false) channel=beta ;;
            pull_request:*:false) channel="pr" ;;
            *) echo "::error::$EVENT on $REF cannot publish (versioned: $versioned)"; exit 1 ;;
          esac

          if [ "$channel" = latest ] && [ -n "$VERSION" ]; then
            version="$VERSION"
          elif [ "$channel" = latest ]; then
            current=$(curl -fsS https://registry.npmjs.org/-/package/@opencode%2fcli/dist-tags | jq -r .latest)
            if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "::error::Unexpected latest version: $current"; exit 1; fi
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) version="$major.$minor.$((patch + 1))" ;;
            esac
            if [ "$major" -lt 2 ]; then version=2.0.0; fi
          else
            version="0.0.0-$channel-$RUN_NUMBER"
            if [ "$RUN_ATTEMPT" != 1 ]; then version="$version.$RUN_ATTEMPT"; fi
          fi

          if [ "$channel" = latest ]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$version" == 0.0.0-* ]]; then
              echo "::error::Invalid release version: $version"
              exit 1
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@opencode%2fcli/$version")
            if [ "$status" = 200 ]; then echo "::error::@opencode/cli@$version is already published"; exit 1; fi
          fi

          case "$channel" in
            latest) npm_tag=latest desktop_channel=prod release=true sign_cli=true desktop=true npm=true node_cli=false ;;
            dev) npm_tag=dev desktop_channel=dev release=false sign_cli=true desktop=false npm=true node_cli=true ;;
            beta) npm_tag="" desktop_channel=beta release=false sign_cli=false desktop=true npm=false node_cli=false ;;
            pr) npm_tag=pr desktop_channel=prod release=true sign_cli=true desktop=true npm=true node_cli=true ;;
          esac
          dry_run=false
          if [ "$channel" = pr ]; then dry_run=true; fi

          {
            echo "version=$version"
            echo "channel=$channel"
            echo "npm_tag=$npm_tag"
            echo "desktop_channel=$desktop_channel"
            echo "dry_run=$dry_run"
            echo "release=$release"
            echo "sign_cli=$sign_cli"
            echo "desktop=$desktop"
            echo "npm=$npm"
            echo "node_cli=$node_cli"
          } | tee -a "$GITHUB_OUTPUT"

  # Creates the commit a versioned release builds from: package.json versions and the changelog on
  # top of the dispatched dev commit. The v* tag points at it. Runs git only.
  source:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.plan.outputs.channel == 'latest'
        with:
          ref: ${{ github.sha }}

      - id: commit
        if: needs.plan.outputs.channel == 'latest'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          tag="v$VERSION"
          git ls-files -z -- '*package.json' bun.lock | xargs -0 sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/g"

          if [ -n "$NOTES" ] && ! grep -qF -x "## $tag" CHANGELOG.md && ! grep -qF "## $tag " CHANGELOG.md; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            awk -v entry="## $tag — $(date -u +%F)" -v notes="$RUNNER_TEMP/notes.md" '
              function emit() { print entry; print ""; while ((getline line < notes) > 0) print line; print ""; done = 1 }
              !done && /^## / { emit() }
              { print }
              END { if (!done) { print ""; emit() } }
            ' CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
            mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          fi

          if git diff --name-only | grep -vE '(^|/)package\.json$|^bun\.lock$|^CHANGELOG\.md$'; then
            echo "::error::The release commit may only change versions and the changelog"
            exit 1
          fi

          git -c core.hooksPath=/dev/null \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --no-verify -q -am "release: $tag"

          # A rerun reuses the tag when it holds the same tree.
          existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -n "$existing" ]; then
            git fetch -q --depth=1 origin "refs/tags/$tag"
            if [ "$(git rev-parse "$existing^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "::error::Tag $tag already exists with different contents"
              exit 1
            fi
            echo "sha=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -q origin "HEAD:refs/tags/$tag"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build: repository code, no environment, no secrets, no id-token.
  # ---------------------------------------------------------------------------

  build-cli:
    needs: [plan, source]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Build CLI
        run: ./packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.plan.outputs.channel }}
          OPENCODE_RELEASE_NOTES: ${{ needs.plan.outputs.channel == 'latest' && inputs.release_notes || '' }}
          # Read-only; raises the rate limit for Bun release downloads.
          GH_TOKEN: ${{ github.token }}

      - name: Stage artifact
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R packages/cli/dist/cli-* "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-dist
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  build-node-app-archive:
    needs: [plan, source]
    if: needs.plan.outputs.node_cli == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build app archive
        run: bun packages/cli/script/build-node.ts --app-archive-only --app-archive=.cache/app-archive.bin --skip-install
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.plan.outputs.channel }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-app-archive
          path: packages/cli/.cache/app-archive.bin
          if-no-files-found: error

  build-node-cli:
    needs: [plan, source, build-node-app-archive]
    if: needs.plan.outputs.node_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: linux-arm64
            host: blacksmith-4vcpu-ubuntu-2404-arm
          - target: linux-x64
            host: blacksmith-4vcpu-ubuntu-2404
          - target: darwin-arm64
            host: macos-26
          - target: windows-arm64
            host: blacksmith-4vcpu-windows-2025
            bun_install_flags: --cpu=*
          - target: windows-x64
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-app-archive
          path: packages/cli/.cache

      - name: Build
        run: bun packages/cli/script/build-node.ts --target="$TARGET" --skip-install --outdir=dist/node --app-archive=.cache/app-archive.bin
        env:
          TARGET: ${{ matrix.settings.target }}
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.plan.outputs.channel }}

      - name: Verify service lifecycle
        if: matrix.settings.target != 'windows-arm64'
        working-directory: packages/cli
        run: bun run script/service-smoke.ts --node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-cli-${{ matrix.settings.target }}
          path: packages/cli/dist/node/cli-node-*
          if-no-files-found: error

  # Packs every npm package (libraries, the CLI wrapper and all platform packages) and the Linux and
  # Node CLI archives. macOS and Windows CLI packages are re-packed after signing.
  build-npm:
    needs: [plan, source, build-cli, build-node-cli]
    if: ${{ !cancelled() && !failure() && (needs.plan.outputs.npm == 'true' || needs.plan.outputs.release == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.node_cli == 'true'
        with:
          pattern: node-cli-*
          path: packages/cli/dist/node
          merge-multiple: true

      - name: Pack
        run: |
          rm packages/cli/dist/SHA256SUMS
          bun ./script/pack.ts
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.plan.outputs.channel }}

      - name: Stage artifacts
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/npm" "$out/cli-npm-macos" "$out/cli-npm-windows" "$out/cli-archives"
          mv dist/npm/opencode-cli-darwin-*.tgz "$out/cli-npm-macos/"
          mv dist/npm/opencode-cli-windows-*.tgz "$out/cli-npm-windows/"
          mv dist/npm/*.tgz "$out/npm/"
          mv dist/archives/* "$out/cli-archives/"
          for dir in "$out"/*; do
            (cd "$dir" && find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS)
            cat "$dir/SHA256SUMS"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm
          path: ${{ runner.temp }}/out/npm
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-npm-macos
          path: ${{ runner.temp }}/out/cli-npm-macos
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-npm-windows
          path: ${{ runner.temp }}/out/cli-npm-windows
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-archives
          path: ${{ runner.temp }}/out/cli-archives
          if-no-files-found: error

  build-docker:
    needs: [plan, source, build-cli]
    if: needs.plan.outputs.release == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chmod +x packages/cli/dist/cli-linux-*-musl/bin/opencode
          mkdir -p "$RUNNER_TEMP/out"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/anomalyco/opencode:$VERSION" \
            --output "type=oci,dest=$RUNNER_TEMP/out/opencode-image.tar" \
            packages/cli
          cd "$RUNNER_TEMP/out" && sha256sum opencode-image.tar > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  build-desktop:
    needs: [plan, source, build-cli]
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            os: mac
            arch: x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            os: mac
            arch: arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: windows-2025
            target: aarch64-pc-windows-msvc
            os: win
            arch: arm64
            bun_install_flags: --cpu=*
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            os: win
            arch: x64
          - host: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x64
          - host: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
    runs-on: ${{ matrix.settings.host }}
    env:
      OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
      OPENCODE_CHANNEL: ${{ needs.plan.outputs.desktop_channel }}
      OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install rpm
        if: matrix.settings.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ needs.plan.outputs.channel == 'beta' && 'beta' || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.plan.outputs.version }}

      # macOS and Windows produce an unsigned app directory. The release environment signs it.
      - name: Package
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OS: ${{ matrix.settings.os }}
          ARCH: ${{ matrix.settings.arch }}
        run: |
          flags=("--$OS" "--$ARCH" --publish never --config electron-builder.config.ts)
          if [ "$OS" = mac ]; then flags+=(--dir -c.mac.identity=null); fi
          if [ "$OS" = win ]; then flags+=(--dir); fi
          npx electron-builder "${flags[@]}"

      - name: Stage artifact
        env:
          OS: ${{ matrix.settings.os }}
          ARCH: ${{ matrix.settings.arch }}
        run: |
          if command -v cygpath > /dev/null; then RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP"); fi
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cd packages/desktop/dist
          case "$OS" in
            mac)
              app=$(find . -maxdepth 2 -path "./mac*/*.app" -type d)
              if [ "$(printf '%s\n' "$app" | grep -c .)" != 1 ]; then echo "Expected one .app bundle, found: $app"; exit 1; fi
              tar -cf "$out/opencode-desktop-mac-$ARCH.app.tar" -C "$(dirname "$app")" "$(basename "$app")"
              ;;
            win)
              unpacked=$(find . -maxdepth 1 -name "*-unpacked" -type d)
              if [ "$(printf '%s\n' "$unpacked" | grep -c .)" != 1 ]; then echo "Expected one unpacked app, found: $unpacked"; exit 1; fi
              cp -R "$unpacked" "$out/app"
              ;;
            linux)
              cp opencode-desktop-linux-*.AppImage opencode-desktop-linux-*.deb opencode-desktop-linux-*.rpm "$out/"
              ;;
          esac
          cd "$out"
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-unsigned-${{ matrix.settings.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # electron-builder packages the NSIS installer around the signed app. This still runs repository
  # config, so it is a build job; the installer it produces is signed in the next stage.
  package-desktop-windows:
    needs: [plan, source, sign-desktop-windows]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2025
            target: aarch64-pc-windows-msvc
            arch: arm64
            bun_install_flags: --cpu=*
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.dry_run == 'true' && 'desktop-unsigned' || 'desktop-signed-app' }}-${{ matrix.settings.target }}
          path: ${{ runner.temp }}/signed

      - name: Package installer
        working-directory: packages/desktop
        timeout-minutes: 30
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.plan.outputs.desktop_channel }}
          OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
          ARCH: ${{ matrix.settings.arch }}
        run: |
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          npm pkg set "version=$OPENCODE_VERSION"
          bun ./scripts/copy-icons.ts "$OPENCODE_CHANNEL"
          npx electron-builder --win "--$ARCH" --prepackaged "$RUNNER_TEMP/signed/app" --publish never --config electron-builder.config.ts
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp "dist/opencode-desktop-win-$ARCH.exe" "$out/"
          cd "$out" && sha256sum "opencode-desktop-win-$ARCH.exe" > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-installer-unsigned-${{ matrix.settings.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # Attests what the build jobs produced. Runs no repository code; holds id-token only for Sigstore.
  attest:
    needs: [plan, build-npm]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.channel != 'beta' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{npm,cli-archives}"
          path: artifacts

      - name: Verify checksums
        run: |
          for dir in artifacts/*; do
            (cd "$dir"
              sha256sum -c --strict SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/npm/*.tgz
            artifacts/cli-archives/opencode*

  # ---------------------------------------------------------------------------
  # Sign: environment release. No repository checkout, no repository code.
  # On pull requests these run without an environment and skip every step that needs a secret.
  # ---------------------------------------------------------------------------

  sign-cli-macos:
    needs: [plan, build-npm]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.sign_cli == 'true' }}
    runs-on: macos-26
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm-macos
          path: ${{ runner.temp }}/in

      - name: Verify artifact
        working-directory: ${{ runner.temp }}/in
        run: |
          shasum -a 256 -c SHA256SUMS
          diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: needs.plan.outputs.dry_run != 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign and re-pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          cat > "$RUNNER_TEMP/cli.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-executable-page-protection</key>
              <true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF
          identity=- timestamp=--timestamp=none
          if [ "$DRY_RUN" != true ]; then
            identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
            if [ -z "$identity" ]; then echo "Developer ID Application identity not found"; exit 1; fi
            timestamp=--timestamp
          fi

          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          export COPYFILE_DISABLE=1
          for target in darwin-arm64 darwin-x64 darwin-x64-baseline; do
            tgz="$RUNNER_TEMP/in/opencode-cli-$target-$VERSION.tgz"
            work="$RUNNER_TEMP/work/$target"
            mkdir -p "$work"
            tar -xzf "$tgz" -C "$work"
            bin="$work/package/bin/opencode"
            file -b "$bin" | grep -q '^Mach-O'
            chmod 755 "$bin"
            codesign --force "$timestamp" --options runtime --entitlements "$RUNNER_TEMP/cli.entitlements" --sign "$identity" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            tar --no-mac-metadata -czf "$out/opencode-cli-$target-$VERSION.tgz" -C "$work" package
            touch -t 198001010000 "$bin"
            (cd "$work/package/bin" && zip -X -q "$out/opencode-$target.zip" opencode)
          done

      - id: stage
        working-directory: ${{ runner.temp }}/out
        run: |
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done > SHA256SUMS
          cat SHA256SUMS
          echo "digest=$(shasum -a 256 SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-macos-signed
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  sign-cli-windows:
    needs: [plan, build-npm]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.sign_cli == 'true' }}
    runs-on: windows-2025
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm-windows
          path: ${{ runner.temp }}/in

      - name: Verify and unpack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          cd "$RUNNER_TEMP/in"
          sha256sum -c --strict SHA256SUMS
          diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          for target in windows-arm64 windows-x64 windows-x64-baseline; do
            mkdir -p "$RUNNER_TEMP/work/$target"
            tar -xzf "opencode-cli-$target-$VERSION.tgz" -C "$RUNNER_TEMP/work/$target"
            test -s "$RUNNER_TEMP/work/$target/package/bin/opencode.exe"
          done

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        if: needs.plan.outputs.dry_run != 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        if: needs.plan.outputs.dry_run != 'true'
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ runner.temp }}\work\windows-arm64\package\bin\opencode.exe
            ${{ runner.temp }}\work\windows-x64\package\bin\opencode.exe
            ${{ runner.temp }}\work\windows-x64-baseline\package\bin\opencode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signatures
        if: needs.plan.outputs.dry_run != 'true'
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\work" -Recurse -Filter opencode.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne "Valid") { throw "Invalid signature for $($_.FullName): $($sig.Status)" }
          }

      - name: Re-pack npm packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$RUNNER_TEMP/out"
          for target in windows-arm64 windows-x64 windows-x64-baseline; do
            tar -czf "$RUNNER_TEMP/out/opencode-cli-$target-$VERSION.tgz" -C "$RUNNER_TEMP/work/$target" package
          done

      - name: Create archives
        shell: pwsh
        run: |
          foreach ($target in "windows-arm64", "windows-x64", "windows-x64-baseline") {
            Compress-Archive -Path "$env:RUNNER_TEMP\work\$target\package\bin\opencode.exe" -DestinationPath "$env:RUNNER_TEMP\out\opencode-$target.zip"
          }

      - id: stage
        working-directory: ${{ runner.temp }}/out
        run: |
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-signed
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # Signs both macOS apps inside-out, notarizes them in one submission, staples them, and only then
  # builds the zip, dmg and .app.tar.gz from the signed apps.
  sign-desktop-macos:
    needs: [plan, build-desktop]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.desktop == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/in/arm64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-unsigned-x86_64-apple-darwin
          path: ${{ runner.temp }}/in/x64

      - name: Verify and unpack
        run: |
          for arch in arm64 x64; do
            (cd "$RUNNER_TEMP/in/$arch"
              shasum -a 256 -c SHA256SUMS
              diff <(find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort))
            mkdir -p "$RUNNER_TEMP/apps/$arch"
            tar -xf "$RUNNER_TEMP/in/$arch/opencode-desktop-mac-$arch.app.tar" -C "$RUNNER_TEMP/apps/$arch"
            if [ "$(find "$RUNNER_TEMP/apps/$arch" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" != 1 ] || [ "$(find "$RUNNER_TEMP/apps/$arch" -mindepth 1 -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')" != 1 ]; then
              echo "Expected exactly one .app bundle for $arch"
              exit 1
            fi
          done

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: needs.plan.outputs.dry_run != 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign apps
        env:
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          cat > "$RUNNER_TEMP/app.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.device.audio-input</key>
              <true/>
          </dict>
          </plist>
          EOF
          # The bundled Bun CLI loads bun-pty's native library; Electron and its helpers do not need this exception.
          cat > "$RUNNER_TEMP/cli.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF
          identity=- timestamp=--timestamp=none
          if [ "$DRY_RUN" != true ]; then
            identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
            if [ -z "$identity" ]; then echo "Developer ID Application identity not found"; exit 1; fi
            timestamp=--timestamp
          fi
          sign() {
            codesign --force "$timestamp" --options runtime --entitlements "$2" --sign "$identity" "$1"
          }

          for arch in arm64 x64; do
            app=$(find "$RUNNER_TEMP/apps/$arch" -mindepth 1 -maxdepth 1 -name '*.app' -type d)
            # Every nested Mach-O file and bundle, deepest first, then the app itself.
            {
              find "$app/Contents" -type f -print0 | while IFS= read -r -d '' f; do
                case "$(file -b --mime-type "$f")" in application/x-mach-binary*) printf '%s\n' "$f" ;; esac
              done
              find "$app/Contents" -type d \( -name '*.app' -o -name '*.framework' \) -print
            } | awk -F/ '{ print NF "\t" $0 }' | sort -t "$(printf '\t')" -k1,1nr | cut -f2- > "$RUNNER_TEMP/sign-$arch.txt"
            echo "Signing $(wc -l < "$RUNNER_TEMP/sign-$arch.txt" | tr -d ' ') items in $app"
            while IFS= read -r item; do
              if [ "$item" = "$app/Contents/Resources/opencode-cli" ]; then
                sign "$item" "$RUNNER_TEMP/cli.entitlements"
              else
                sign "$item" "$RUNNER_TEMP/app.entitlements"
              fi
            done < "$RUNNER_TEMP/sign-$arch.txt"
            sign "$app" "$RUNNER_TEMP/app.entitlements"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Notarize and staple
        if: needs.plan.outputs.dry_run != 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/apps" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 60m --output-format json > "$RUNNER_TEMP/notarize.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notarize.json"
          if [ "$(jq -r .status "$RUNNER_TEMP/notarize.json")" != Accepted ]; then
            echo "Notarization was not accepted"
            exit 1
          fi
          for arch in arm64 x64; do
            app=$(find "$RUNNER_TEMP/apps/$arch" -mindepth 1 -maxdepth 1 -name '*.app' -type d)
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      - name: Package signed apps
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for arch in arm64 x64; do
            app=$(find "$RUNNER_TEMP/apps/$arch" -mindepth 1 -maxdepth 1 -name '*.app' -type d)
            name=$(basename "$app")
            ditto -c -k --sequesterRsrc --keepParent "$app" "$out/opencode-desktop-mac-$arch.zip"
            staging="$RUNNER_TEMP/dmg-$arch"
            mkdir -p "$staging"
            ditto "$app" "$staging/$name"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname "${name%.app}" -srcfolder "$staging" -fs HFS+ -format UDZO -ov "$out/opencode-desktop-mac-$arch.dmg"
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$out/opencode-desktop-mac-$arch.app.tar.gz" -C "$(dirname "$app")" "$name"
          done

      - id: stage
        working-directory: ${{ runner.temp }}/out
        run: |
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done > SHA256SUMS
          cat SHA256SUMS
          echo "digest=$(shasum -a 256 SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # Signs every executable and native module in both unpacked Windows apps before the installer is built.
  sign-desktop-windows:
    needs: [plan, build-desktop]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.desktop == 'true' && needs.plan.outputs.dry_run != 'true' }}
